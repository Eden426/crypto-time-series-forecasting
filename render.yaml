services:
  - type: web
    name: crypto-forecasting-backend
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: HF_REPO_ID
        value: Eden-N/crypto-time-series-gru
      - key: ALLOWED_ORIGINS
        value: "*"
